services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nodebi}
      POSTGRES_USER: ${POSTGRES_USER:-nodebi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nodebi_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodebi} -d ${POSTGRES_DB:-nodebi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://nodebi:nodebi_dev@postgres:5432/nodebi}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/sources}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      MAX_PREVIEW_ROWS: ${MAX_PREVIEW_ROWS:-200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["sh", "-c", "python -m app.infrastructure.wait_database && alembic upgrade head && python -m app.services.file_cleanup && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - source_files:/data/sources
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  source_files:
