name: nodebi-demo
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nodebi_demo
      POSTGRES_USER: nodebi_demo
      POSTGRES_PASSWORD: local_demo_only
    volumes:
      - demo_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodebi_demo -d nodebi_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nodebi_demo:local_demo_only@postgres:5432/nodebi_demo
      STORAGE_ROOT: /data/sources
      CORS_ORIGINS: '["http://localhost:3030","http://127.0.0.1:3030"]'
    command: ["sh", "-c", "python -m app.infrastructure.wait_database && alembic upgrade head && python -m app.services.file_cleanup && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8030:8000"
    volumes:
      - demo_sources:/data/sources
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8030
    ports:
      - "127.0.0.1:3030:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  demo_database:
  demo_sources:
