name: Quality and compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nodebi_test
          POSTGRES_USER: nodebi_test
          POSTGRES_PASSWORD: ci_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodebi_test -d nodebi_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements-runtime.txt
            backend/constraints-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend with validated constraints
        run: python -m pip install -r backend/requirements-runtime.txt -c backend/constraints-dev.txt -e './backend[dev]'
      - name: Updater non-mutating safety checks
        shell: pwsh
        run: ./scripts/tests/Update-NodeBI.Tests.ps1
      - name: Backend lint, types and SQLite/PostgreSQL regression
        working-directory: backend
        env:
          NODEBI_TEST_POSTGRES_URL: postgresql+psycopg://nodebi_test:ci_local_only@127.0.0.1:5432/nodebi_test
        run: |
          ruff check app scripts tests
          mypy app
          pytest -q --tb=short
      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend contracts, tests, security and build
        working-directory: frontend
        run: |
          npm run api:check
          npm run typecheck
          npm run lint
          npm test -- --maxWorkers=2
          npm audit --audit-level=high
          npm run build
